<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>通知设置 - 用户社区</title>

    <link rel="stylesheet" href="/static/css/request.css?v=1.9.6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script nonce="{{ request.state.csp_nonce }}" src="https://cdn.tailwindcss.com"></script>
    <script nonce="{{ request.state.csp_nonce }}">
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a' } } } }
        }
    </script>
    <script nonce="{{ request.state.csp_nonce }}">
        // 与用户端主题保持一致（localStorage: ep_theme + html.dark）
        (function () {
            try {
                var t = localStorage.getItem('ep_theme');
                if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .ns-toggle { transition: background-color .2s; }
        .ns-toggle .ns-dot { transition: transform .2s; }
    </style>
</head>
<body class="antialiased min-h-screen relative overflow-x-hidden transition-colors duration-500 bg-slate-50 text-slate-800 dark:bg-black dark:text-zinc-100">

    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-20%] left-[-10%] w-[70%] h-[70%] rounded-full blur-3xl opacity-60 dark:opacity-10 transition-colors duration-1000 bg-teal-200/60 dark:bg-indigo-900/30"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] rounded-full blur-3xl opacity-60 dark:opacity-10 transition-colors duration-1000 bg-blue-200/50 dark:bg-purple-900/20"></div>
    </div>

    <main class="relative max-w-lg mx-auto px-4 pt-6 pb-16">
        <!-- 顶部导航 -->
        <div class="flex items-center gap-3 mb-5">
            <a href="/request?tab=profile" class="w-9 h-9 rounded-full bg-white/70 dark:bg-white/10 backdrop-blur flex items-center justify-center text-slate-500 dark:text-zinc-300 hover:text-brand-500 shadow-sm transition-colors">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </a>
            <h1 class="text-lg font-black text-slate-900 dark:text-white flex items-center gap-2">
                <i class="fa-solid fa-bell text-emerald-500"></i> 通知设置
            </h1>
        </div>

        <p class="text-[11px] text-slate-500 dark:text-zinc-400 mb-5 leading-relaxed">选择推送渠道与接收内容（仅影响你本人）。与管理端系统级 Bark 互不干预。</p>

        <!-- 加载态 -->
        <div id="ns-loading" class="flex flex-col items-center justify-center py-16 gap-3">
            <i class="fa-solid fa-circle-notch fa-spin text-2xl text-emerald-500"></i>
            <div class="text-sm text-slate-500">加载中...</div>
        </div>

        <div id="ns-body" class="hidden space-y-4">
            <!-- 推送渠道 -->
            <section class="glass-panel p-4 rounded-3xl border border-white/40 dark:border-white/5">
                <div class="text-[11px] font-black tracking-widest uppercase text-slate-400 mb-3">推送渠道（二选一）</div>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="ns-ch-bark" onclick="nsSelectChannel('bark')" class="py-3 rounded-2xl text-xs font-bold transition flex flex-col items-center justify-center gap-1 border">
                        <i class="fa-solid fa-bell text-lg"></i> Bark 链接
                    </button>
                    <button type="button" id="ns-ch-webhook" onclick="nsSelectChannel('webhook')" class="py-3 rounded-2xl text-xs font-bold transition flex flex-col items-center justify-center gap-1 border">
                        <i class="fa-solid fa-webhook text-lg"></i> 自定义 Webhook
                    </button>
                </div>

                <div id="ns-bark-box" class="mt-3 hidden">
                    <label class="text-[11px] font-black tracking-widest uppercase text-slate-400 mb-1.5 block">Bark 推送链接</label>
                    <input type="text" id="ns-bark-url" placeholder="https://你的Bark服务/DeviceKey" class="w-full px-3 py-2.5 rounded-xl bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 text-[13px] outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div id="ns-webhook-box" class="mt-3 hidden">
                    <label class="text-[11px] font-black tracking-widest uppercase text-slate-400 mb-1.5 block">Webhook 地址</label>
                    <input type="text" id="ns-webhook-url" placeholder="https://你的Webhook接收地址" class="w-full px-3 py-2.5 rounded-xl bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 text-[13px] outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </section>

            <!-- 接收内容 -->
            <section class="glass-panel p-4 rounded-3xl border border-white/40 dark:border-white/5">
                <div class="text-[11px] font-black tracking-widest uppercase text-slate-400 mb-3">接收内容</div>
                <div class="space-y-2" id="ns-switches">
                    <div class="flex items-center justify-between p-3 bg-white dark:bg-white/5 rounded-2xl border border-slate-100 dark:border-white/5">
                        <div>
                            <div class="text-sm font-bold text-slate-800 dark:text-white">新片入库通知</div>
                            <div class="text-[10px] text-slate-400">新影视入库时提醒</div>
                        </div>
                        <button type="button" onclick="nsToggle('notify_new_item')" class="ns-toggle w-11 h-6 rounded-full relative shrink-0 bg-slate-300 dark:bg-slate-600">
                            <span class="ns-dot absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full"></span>
                        </button>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-white dark:bg-white/5 rounded-2xl border border-slate-100 dark:border-white/5">
                        <div>
                            <div class="text-sm font-bold text-slate-800 dark:text-white">管理员消息</div>
                            <div class="text-[10px] text-slate-400">管理员在消息界面发给你的消息</div>
                        </div>
                        <button type="button" onclick="nsToggle('notify_admin_message')" class="ns-toggle w-11 h-6 rounded-full relative shrink-0 bg-slate-300 dark:bg-slate-600">
                            <span class="ns-dot absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full"></span>
                        </button>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-white dark:bg-white/5 rounded-2xl border border-slate-100 dark:border-white/5">
                        <div>
                            <div class="text-sm font-bold text-slate-800 dark:text-white">全站公告</div>
                            <div class="text-[10px] text-slate-400">管理员发布的全站公告</div>
                        </div>
                        <button type="button" onclick="nsToggle('notify_announcement')" class="ns-toggle w-11 h-6 rounded-full relative shrink-0 bg-slate-300 dark:bg-slate-600">
                            <span class="ns-dot absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full"></span>
                        </button>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-white dark:bg-white/5 rounded-2xl border border-slate-100 dark:border-white/5">
                        <div>
                            <div class="text-sm font-bold text-slate-800 dark:text-white">心愿清单状态变动</div>
                            <div class="text-[10px] text-slate-400">我的心愿状态变化时提醒（有变动才推）</div>
                        </div>
                        <button type="button" onclick="nsToggle('notify_wishlist')" class="ns-toggle w-11 h-6 rounded-full relative shrink-0 bg-slate-300 dark:bg-slate-600">
                            <span class="ns-dot absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full"></span>
                        </button>
                    </div>
                </div>
            </section>

            <p class="text-[10px] text-slate-400 flex items-center gap-1.5 px-1">
                <i class="fa-solid fa-info-circle"></i> 推送内容不含网址：反代后无法推送最新网址，且可能暴露真实端口。
            </p>

            <!-- 保存 -->
            <div class="pt-1">
                <div id="ns-msg" class="text-[11px] mb-2 text-center hidden"></div>
                <button type="button" id="ns-save-btn" onclick="nsSave()" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 disabled:bg-slate-300 dark:disabled:bg-slate-700 text-white rounded-2xl text-sm font-bold transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 active:scale-95">
                    <i id="ns-save-icon" class="fa-solid fa-check"></i><span id="ns-save-text">保存设置</span>
                </button>
            </div>
        </div>
    </main>

    <script nonce="{{ request.state.csp_nonce }}">
        // 🔥 用户级通知设置独立页（1.9.6 重构）：纯原生 JS，不依赖 Alpine，
        // 彻底规避组件作用域 / JS 缓存 / 覆盖层等交互问题。
        var nsSettings = {
            channel: 'none', bark_url: '', webhook_url: '',
            notify_new_item: false, notify_admin_message: false,
            notify_announcement: false, notify_wishlist: false
        };
        var nsSaving = false;

        function nsSelectChannel(c) {
            nsSettings.channel = c;
            nsRenderChannel();
        }

        function nsRenderChannel() {
            var bark = document.getElementById('ns-ch-bark');
            var wh = document.getElementById('ns-ch-webhook');
            var on = 'bg-emerald-500 text-white border-emerald-500';
            var off = 'bg-white dark:bg-white/5 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-white/10';
            bark.className = 'py-3 rounded-2xl text-xs font-bold transition flex flex-col items-center justify-center gap-1 border ' + (nsSettings.channel === 'bark' ? on : off);
            wh.className = 'py-3 rounded-2xl text-xs font-bold transition flex flex-col items-center justify-center gap-1 border ' + (nsSettings.channel === 'webhook' ? on : off);
            document.getElementById('ns-bark-box').classList.toggle('hidden', nsSettings.channel !== 'bark');
            document.getElementById('ns-webhook-box').classList.toggle('hidden', nsSettings.channel !== 'webhook');
        }

        function nsToggle(key) {
            nsSettings[key] = !nsSettings[key];
            nsRenderSwitches();
        }

        function nsRenderSwitches() {
            var boxes = document.querySelectorAll('#ns-switches .ns-toggle');
            var keys = ['notify_new_item', 'notify_admin_message', 'notify_announcement', 'notify_wishlist'];
            boxes.forEach(function (btn, i) {
                var on = nsSettings[keys[i]];
                btn.classList.toggle('bg-emerald-500', on);
                btn.classList.toggle('bg-slate-300', !on);
                btn.classList.toggle('dark:bg-slate-600', !on);
                var dot = btn.querySelector('.ns-dot');
                dot.style.transform = on ? 'translateX(20px)' : 'translateX(2px)';
            });
        }

        function nsCollect() {
            nsSettings.bark_url = (document.getElementById('ns-bark-url').value || '').trim();
            nsSettings.webhook_url = (document.getElementById('ns-webhook-url').value || '').trim();
            return nsSettings;
        }

        async function nsLoad() {
            try {
                var res = await fetch('/api/user/notify_settings', { credentials: 'same-origin' });
                var d = await res.json();
                if (d.status === 'success' && d.data) {
                    nsSettings = Object.assign(nsSettings, d.data);
                    document.getElementById('ns-bark-url').value = nsSettings.bark_url || '';
                    document.getElementById('ns-webhook-url').value = nsSettings.webhook_url || '';
                    nsRenderChannel();
                    nsRenderSwitches();
                    document.getElementById('ns-loading').classList.add('hidden');
                    document.getElementById('ns-body').classList.remove('hidden');
                } else {
                    // 未登录或异常：回到用户端登录页
                    window.location.href = '/request_login';
                }
            } catch (e) {
                window.location.href = '/request_login';
            }
        }

        async function nsSave() {
            if (nsSaving) return;
            nsSaving = true;
            var btn = document.getElementById('ns-save-btn');
            var icon = document.getElementById('ns-save-icon');
            var text = document.getElementById('ns-save-text');
            var msg = document.getElementById('ns-msg');
            btn.disabled = true;
            icon.className = 'fa-solid fa-spinner fa-spin';
            text.textContent = '保存中...';
            msg.className = 'text-[11px] mb-2 text-center hidden';
            try {
                var res = await fetch('/api/user/notify_settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(nsCollect())
                });
                var d = await res.json();
                msg.textContent = d.message || '操作完成';
                msg.className = 'text-[11px] mb-2 text-center ' + (d.status === 'success' ? 'text-emerald-500' : 'text-rose-500');
                if (d.status === 'success') {
                    setTimeout(function () { window.location.href = '/request?tab=profile'; }, 1000);
                }
            } catch (e) {
                msg.textContent = '网络异常，请稍后重试';
                msg.className = 'text-[11px] mb-2 text-center text-rose-500';
            } finally {
                btn.disabled = false;
                icon.className = 'fa-solid fa-check';
                text.textContent = '保存设置';
                nsSaving = false;
            }
        }

        nsLoad();
    </script>
</body>
</html>
